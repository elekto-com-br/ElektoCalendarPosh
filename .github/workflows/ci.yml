name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: Install-PSResource -Name Pester, PSScriptAnalyzer -Repository PSGallery -TrustRepository -Quiet

      # Parses every script, validates the manifest, runs PSScriptAnalyzer, imports the module,
      # runs the Pester tests and stages ./out/ElektoCalendarPosh.
      - name: Build and test
        shell: pwsh
        run: ./Build.ps1
